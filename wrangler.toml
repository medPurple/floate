# Configuration Cloudflare Workers (Static Assets) pour le front floate.
# Utilisé si tu déploies via Workers Builds plutôt que Cloudflare Pages.
# Si tu es sur Pages classique, ce fichier est ignoré.
name = "floate"
compatibility_date = "2024-09-23"

# Sert le dossier produit par `npm run build` en static assets.
# `single-page-application` réécrit toutes les routes inconnues vers
# index.html — indispensable pour le hash-routing de vue-router au
# moment d'un reload sur /r/AKZ-394 par exemple.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
